  - name: "Training"
    entries:
      - title: "Research Secondment: IBMCP, Valencia"
        text: "May 2026. Secondment in the lab of Aureliano Bombarely at IBMCP (Instituto de Biología Molecular y Celular de Plantas), Valencia, working on functional annotation of plant proteomes."
      - title: "LongTREC Final Meeting: Wrap-Up & Closing"
        text: "Closing meeting following VALT2026: ERC-style grant-proposal practice, career-planning discussions, talks on technology transfer, venture capital, and corporate values in the bioindustry, a round-table on AI for grant and paper writing, and the network's final deliverables and closing. 2–3 July 2026. Valencia, Spain."
      - title: "LongTREC Summer School in Long-Read Transcriptomics"
        text: "4-day summer school where LongTREC doctoral candidates delivered training in lrRNA-seq methods to participants from across Europe. I taught sessions on long-read RNA-seq transcript reconstruction concepts, working with large replicated data sets, functional annotation with IsoAnnot Lite, and visualization with tappAS. ~July 2025. Earlham Institute, Norwich, UK."
        link: "https://www.biobam.com/biobam-at-the-longtrec-summer-school/"
      - title: "Tutorial IP3: Genomic Variant Interpretation & Prioritisation for Clinical Research"
        text: "Workshop at ISMB/ECCB 2025. July 19, 2025."
      - title: "Consultant: Hexaploid Sweet Potato lrRNA-seq Analysis"
        text: "April 2025 – February 2026. Consultant on a project analyzing hexaploid sweet potato long-read RNA-seq data, exploring transcript reconstruction, allele-specific expression, and fusion transcript analysis."
      - title: "LongTREC Mid-Term Meeting"
        text: "Network meeting with training on software development good practices, containerization, and CI/CD at BSC, and career, exploitation, and communication sessions at CRG. I taught a short course on developing bioinformatic pipelines with Nextflow, together with Fabio and Nadja. 24 February – 4 March 2025. Barcelona, Spain (BSC & CRG)."
      - title: "Research Secondment: SciLifeLab, Stockholm"
        text: "2 months (August–October 2024) in the group of Kristoffer Sahlin at SciLifeLab, Stockholm, Sweden, working on de novo transcript reconstruction for non-model organisms without a reference genome."
      - title: "LongTREC Fellow's Retreat"
        text: "Retreat combining doctoral-candidate project presentations, Thesis Advisory Board meetings, science talks and statistics workshops, and multi-day management training covering feedback, assertiveness, stress management, conflict resolution, and negotiation. 24–30 October 2024. Stockholm, Sweden."
      - title: "Workshop: lrRNA-seq Analysis (LRUA2024)"
        text: "Contributed to teaching a workshop on long-read RNA-seq analysis. LRUA2024. October 2024. Uppsala, Sweden."
      - title: "Workshops: FAIR Principles for Research Software & Data Management"
        text: "Two workshops on applying FAIR principles to research software development and research data management. ECCB2024. September 2024. Turku, Finland."
      - title: "Workshop: Bioinformatics Workflow Development in ONT EPI2ME"
        text: "Workshop on bioinformatics workflow development within the Oxford Nanopore EPI2ME infrastructure, using Nextflow and nf-core. Oxford Nanopore Technologies London Calling 2024. May 2024."
      - title: "LongTREC \"Focus on Research\" and Mid-Term Meeting"
        text: "Network meeting combining LongTREC's 1-year research check-in with an interim mid-term review, including workshops on paper writing, grant writing, and lrRNA-seq data pre-processing across multiple tools. I taught a workshop on long-read bioinformatics data pre-processing with OmicsBox. 9–15 March 2024. CNRS, Valbonne & Nice, France."
      - title: "Spanish Language Classes (A1–B2)"
        text: "October 2023 – May 2025. Centre d'Idiomes de la Universitat de València."
      - title: "Intercept-MDS Single Cell Data Analysis Course"
        text: "3-day series of lectures and hands-on workshops covering single-cell data pre-processing, clustering, cell type annotation, and trajectory analysis. 2023. Valencia, Spain."
      - title: "LongTREC Welcome Retreat"
        text: "Retreat where doctoral candidates were introduced to the network's structure and work packages, presented their PhD projects to host labs and their Thesis Advisory Board, and took part in workshops on long-read RNA-seq library preparation protocols, research ethics, EU research values, NGS/omics applications in the bioindustry, and intellectual property strategy, plus multi-day professional-skills training in project management, time management, and communication. 27 November – 1 December 2023. Valencia, Spain."

